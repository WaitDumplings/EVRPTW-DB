name: CLE generator

on:
  push:
    paths:
      - "EVRPTW_Dataset_Generator/**"
      - ".github/workflows/cle-generator.yml"
  pull_request:
    paths:
      - "EVRPTW_Dataset_Generator/**"
      - ".github/workflows/cle-generator.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: EVRPTW_Dataset_Generator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: EVRPTW_Dataset_Generator/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install generator and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Test
        run: pytest

      - name: Compile
        run: python -m compileall -q src scripts tests
