name: Benchmark solvers

on:
  push:
    paths:
      - "EVRPTW_Benchmark/**"
      - "EVRPTW_Core/**"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/artifacts.py"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/contracts.py"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/metrics.py"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/orders.py"
      - ".github/workflows/benchmark-solvers.yml"
  pull_request:
    paths:
      - "EVRPTW_Benchmark/**"
      - "EVRPTW_Core/**"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/artifacts.py"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/contracts.py"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/metrics.py"
      - "EVRPTW_Dataset_Generator/src/evrptw_stage2/orders.py"
      - ".github/workflows/benchmark-solvers.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}/EVRPTW_Core:${{ github.workspace }}/EVRPTW_Dataset_Generator/src:${{ github.workspace }}/EVRPTW_Benchmark/Exact/Gurobi_Solver:${{ github.workspace }}/EVRPTW_Benchmark/MetaHeuristics:${{ github.workspace }}/EVRPTW_Benchmark/MetaHeuristics/ALNS_Solver:${{ github.workspace }}/EVRPTW_Benchmark/MetaHeuristics/VNS_TS_Solver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            EVRPTW_Benchmark/Exact/Gurobi_Solver/requirements.txt
            EVRPTW_Benchmark/MetaHeuristics/ALNS_Solver/requirements.txt
            EVRPTW_Benchmark/MetaHeuristics/VNS_TS_Solver/requirements.txt

      - name: Install benchmark test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.2,<2.3" "pandas>=2.2,<3" "pyarrow>=15,<22" "scipy>=1.12,<2" "networkx>=3.2,<4"
          python -m pip install "pytest>=8,<9" "ruff>=0.16,<0.17" tqdm gurobipy

      - name: Validate benchmark shells
        env:
          EVRPTW_DATASET_ROOT: EVRPTW_Dataset/Instances_v2/us_11city
          EVRPTW_DRY_RUN: "1"
          EVRPTW_MAX_INSTANCES: "1"
        run: |
          for script in EVRPTW_Benchmark/test_scripts/*.sh; do
            bash -n "$script"
          done
          bash EVRPTW_Benchmark/test_scripts/run_all_cus50_tests.sh
          bash EVRPTW_Benchmark/test_scripts/run_all_cus500_tests.sh
          EVRPTW_SHARD_COUNT=10 EVRPTW_SHARD_INDEX=3 \
            bash EVRPTW_Benchmark/test_scripts/run_all_cus500_tests.sh
          bash -n EVRPTW_Benchmark/scripts/common.sh
          for script in EVRPTW_Benchmark/scripts/{Gurobi,ALNS,VNSTS}/Cus*/*.sh; do
            bash -n "$script"
            bash "$script" >/dev/null
          done
          portable_output="$(
            cd /tmp
            bash "$GITHUB_WORKSPACE/EVRPTW_Benchmark/scripts/VNSTS/Cus50/test1.sh"
          )"
          grep -q '^dataset=EVRPTW_Dataset/' <<<"$portable_output"
          if grep -q '^dataset=/' <<<"$portable_output"; then
            echo "Dataset argument unexpectedly became absolute" >&2
            exit 1
          fi
          if EVRPTW_DATASET_ROOT=/tmp/nonportable bash EVRPTW_Benchmark/scripts/VNSTS/Cus50/test1.sh; then
            echo "Absolute EVRPTW_DATASET_ROOT was unexpectedly accepted" >&2
            exit 1
          fi

      - name: Lint
        run: >-
          ruff check --select E4,E7,E9,F --ignore E402
          EVRPTW_Benchmark/Exact EVRPTW_Benchmark/MetaHeuristics

      - name: Test Exact, ALNS, and VNS-TS
        run: >-
          pytest -q
          EVRPTW_Benchmark/Exact/Gurobi_Solver/tests
          EVRPTW_Benchmark/MetaHeuristics/tests
          EVRPTW_Benchmark/MetaHeuristics/VNS_TS_Solver/tests

      - name: Compile
        run: >-
          python -m compileall -q
          EVRPTW_Benchmark/Exact EVRPTW_Benchmark/MetaHeuristics
