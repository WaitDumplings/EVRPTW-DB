[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evrptw-cle"
version = "0.3.0"
description = "Reproducible City Logistics Environments for practical EVRPTW benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "osmnx>=2.0,<3",
  "pandas>=2.1,<3",
  "pillow>=10,<13",
  "pyarrow>=15,<22",
  "pyogrio>=0.9,<1",
  "requests>=2.31,<3",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
evrptw-cle = "evrptw_cle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evrptw_cle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
