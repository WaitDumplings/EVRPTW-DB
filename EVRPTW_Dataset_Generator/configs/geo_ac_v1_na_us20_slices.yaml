        anchor_lonlat: [-95.1255, 29.7355]
        depot_candidate_count: 8

  - parent_territory_id: seattle_wa_king_county
    children:
      - territory_id: king_wa_seattle_eastside
        display_name: Seattle / Eastside
        service_area_name: Seattle-Eastside
        anchor_lonlat: [-122.2021, 47.6101]
        depot_candidate_count: 8
      - territory_id: king_wa_south_logistics
        display_name: King County South Logistics
        service_area_name: SouthLogistics
        anchor_lonlat: [-122.2285, 47.3809]
        depot_candidate_count: 8

  - parent_territory_id: chicago_il_cook_county
    children:
      - territory_id: cook_il_chicago_core
