territory_split:
  source_config: geo_ac_v1_us10.with_sources.yaml
  slice_config: geo_ac_v1_na_us20_slices.yaml
  split_method: anchored_voronoi_clipped_to_county
  territory_count: 20
  latent_customer_policy:
    rule: round_to_1000(clamp(occupied_housing_units / 4.4, 30000, 160000))
    min: 30000
    max: 160000
    housing_units_per_latent_customer: 4.4
    placement_mode: road_frontage
    road_radius_km: 0.85
    weight_sigma_km: 0.38
    min_access_km: 0.004
    max_access_km: 0.02
    min_road_edge_length_km: 0.015
    max_road_edge_length_km: 0.45
  outlier_filters:
    remove_sparse_remote_community_seeds: true
    remote_seed_nearest_neighbor_km: 15.0
    remove_remote_depots_after_seed_filter: true
    remote_depot_to_seed_km: 25.0
    replenish_depots_after_filter: true
    manual_depot_exclusions:
      la_ca_san_gabriel_pomona_industry:
      - bbox_lonlat:
        - -118.0
        - 34.18
        - -117.6
        - 34.5
        reason: manual QA removed northern open depots outside the retained San Gabriel
          customer core.
      king_wa_seattle_eastside:
      - bbox_lonlat:
        - -121.6
        - 47.4
        - -121.0
        - 47.8
        reason: manual QA removed eastern fallback depots too far from the Seattle/Eastside
          core.
      king_wa_south_logistics:
      - bbox_lonlat:
        - -121.65
        - 47.2
        - -121.0
        - 47.45
        reason: manual QA removed the eastern fallback depot too far from the South
          King logistics core.
      cook_il_chicago_core:
      - bbox_lonlat:
        - -87.65
        - 41.95
        - -87.1
        - 42.2
        reason: manual QA removed northeast fallback depots outside the Chicago core
          service pattern.
