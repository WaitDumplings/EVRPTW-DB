# Template for preparing one additional North American county/city container.
#
# Copy this file, edit the territory block, then run:
#
#   export CENSUS_API_KEY=...
#   export NREL_API_KEY=...
#   conda run -n maojie python -m EVRPTW_Dataset_Generator.prepare_public_geodata \
#     --city-config EVRPTW_Dataset_Generator/configs/my_city.yaml \
#     --output-root EVRPTW_Dataset/Geo_AC_v1/source_data_my_city \
#     --config-out EVRPTW_Dataset_Generator/configs/my_city.with_sources.yaml
#
# A county FIPS code is the most important field. The example below uses
# San Francisco County, CA (06075).

profile_name: Geo-AC-v1 / user-city
dataset_version: Geo-AC-v1
instances_per_scale: 20
region_reuse_limit: 200
max_attempts_per_instance: 30

scales:
  5: 3
  15: 3
  50: 10
  100: 20

depot_catchment:
  start_radius_km: 35.0
  max_radius_km: 50.0
  min_customer_pool: 500

config_overrides:
  shortest_path:
    oracle_mode: source_cache
  visualization:
    max_instance_plots: 4

territories:
  - territory_id: san_francisco_ca_san_francisco_county
    display_name: San Francisco
    county_name: San Francisco County
    state: CA
    county_fips: "06075"
    bbox_lonlat: [-122.5155, 37.7040, -122.3550, 37.8335]
    area_size_km: [[0.0, 15.0], [0.0, 15.0]]
    latent_customer_pool_size: 30000
    cs_candidate_pool_size: 120
    depot_candidate_count: 8
    depot_catchment:
      start_radius_km: 18.0
      max_radius_km: 30.0
      min_customer_pool: 500
