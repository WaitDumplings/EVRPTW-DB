run_name: TERRAN
dataset_name: EVRPTW-DB-Stage2
objective: EVRPTW_Benchmark/Reinforcement_Learning/configs/rivian_energy_vehicle_cost_v1.json
reward_contract: EVRPTW_Benchmark/Reinforcement_Learning/configs/drl_reward_contract_energy_vehicle_v2.json

data:
  stage2_dataset_path: null
  stage2_family_root: null
  stage2_scale: Cus100
  stage2_split_ids: train
  stage2_track_ids: train
  stage2_city_slugs: null
  stage2_cache_size: 4
  num_customers: 100
  num_charging_stations: 20

env:
  use_fast_env: true
  use_jit_mask: true
  normalize_reward: true
  # This remains a distance-only diagnostic. The economic objective divisor is
  # supplied independently by the frozen reward contract for each scale.
  reward_distance_scale_mode: single_customer_repair_median
  # Invalid/dead-end/horizon are failure reasons, not additive step penalties.
  # The terminal task contract charges every failed trajectory exactly once.
  invalid_action_penalty: 0.0
  charging_mode: station_power_full
  matrix_mode: canonical

model:
  embedding_dim: 256
  tanh_clipping: 15.0
  n_encode_layers: 3
  use_graph_token: false
  use_dynamic_embedding: false

training:
  epochs: 300
  num_envs_per_gpu: 64
  n_traj: 100
  rollout_steps: 450
  cache_rollout_encoder: true
  ppo_step_chunk_size: 64
  ppo_update_epochs: 3
  num_minibatches: 4
  # Finite routing episodes use undiscounted returns: late distance costs and
  # completion feedback have the same weight as early ones. PBRS shares gamma.
  gamma: 1.0
  reward_contract_id: drl_energy_vehicle_reference_scale_v2
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  learning_rate: 0.0001
  optimizer: adamw
  weight_decay: 0.01
  max_grad_norm: 1.0
  checkpoint_interval: 25
  gradient_accumulation_steps: 1
  debug: false
  profile_timing: false

pbrs:
  use_customer_pbrs: true
  use_repair_distance_pbrs: true
  use_feasible_ratio_pbrs: false
  use_terminal_heuristic: false
  use_terminal_task_penalty: true
  customer_pbrs_mode: progress
  customer_pbrs_coef: 1.0
  customer_progress_budget: 0.5
  customer_progress_mix: 0.5
  repair_progress_coef: 0.5
  # Formal replacement runs must override this explicitly through the frozen
  # job manifest.  One unit equals one selected-scale reference cost S_N.
  terminal_success_bonus: 0.0
  # Legacy terminal heuristic only; canonical formal training keeps it zero.
  success_bonus: 0.0
  # Populated from the frozen reward contract before environments are built.
  failure_base: 0.0
  unserved_coefficient: 1.0
  annealing:
    enabled: true
    start_scale: 1.0
    end_scale: 0.2
    start_epoch: 1
    # Keep dense guidance through the guaranteed training budget, then leave
    # the optional early-stop tail at the objective-dominant end scale.
    end_epoch: 5000
    schedule: cosine

evaluation:
  eval_interval: 0
