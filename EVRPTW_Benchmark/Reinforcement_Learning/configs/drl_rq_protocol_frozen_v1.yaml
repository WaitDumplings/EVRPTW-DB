protocol_id: drl_rq_protocol_frozen_v1
status: method_frozen_formal_training_active
formal_launch_allowed: true
launch_mode: direct_full
launch_policy: direct_full_user_authorized_2026-09-04
runtime_budget_id: drl_rq_runtime_budget_v13_am5_min5000_max10000_tailval50
supersedes_as_formal_candidate: drl_experiment_protocol_v1
historical_evidence_relabelled: false

methods: [am_evrptw, evrptw_rl, drl_ts, terran]
seeds: [1234]
training_scales: [Cus50, Cus100, Cus500, Cus1000]
evaluation_only_scales: [Cus2000]
training_rollout_steps:
  Cus50: 65
  Cus100: 120
  Cus500: 580
  Cus1000: 1200

research_questions:
  RQ1:
    title: Scale
    main_training_runs: 16
    same_scale: [Cus50, Cus100, Cus500, Cus1000]
    cross_scale_to_cus2000: [Cus100, Cus500, Cus1000]
    reference_title: Reference Availability and Stability of Best-Observed Solutions
    canonical_lower_bound_available: false
    canonical_optimality_gap_available: false
    primary_quality_reference: verified_posthoc_bks
    gurobi_bound_semantics: copy_limited_milp_diagnostic_only
  RQ2:
    title: Training-support coverage
    scale: Cus100
    methods: [am_evrptw, terran]
    support_conditions:
      - Random-10%-support
      - Coverage-10%-support
      - Full-support
    optional_support_conditions: [Random-1%-support]
    additional_core_training_runs: 4
    support_unit: parent_family
    selection_uses_validation_or_test: false
  RQ3:
    title: Euclidean-to-directed-road transfer
    scale: Cus100
    conditions: [E_to_G, G_to_G]
    additional_core_training_runs: 4
    graph_injection_enabled: false

core_training_run_count: 24
train_cus2000: false
energy_relaxed_directed_vrptw_model: excluded

bks:
  eligibility: common_verifier_complete_feasible_only
  contributors: [gurobi, alns, vns_ts, am_evrptw, evrptw_rl, drl_ts, terran]
  posthoc_only: true
  checkpoint_selection_use: forbidden
  provenance_fields: [instance_id, objective, method, seed, decoding_or_budget, solution_id]

ev_integrity:
  name: Route-level infinite-battery counterfactual
  reoptimizes_routes: false
  preserves_customer_order: true
  removes_consecutive_charging_blocks: true
  disables_battery_only_during_counterfactual_replay: true
  prohibited_claims:
    - infinite_battery_optimum
    - optimal_battery_ablation
    - globally_necessary_charging_visit

training_fairness:
  primary: customer_exposure_matched
  secondary: gpu_hour_matched
  sampling: prefix_stable_full_pool_shuffle_cycle
  shared_stream_within_scale_seed: true
  test_used_for_checkpoint_selection: false
  statistical_unit: parent_family
  wall_clock_checkpoints_h: [6, 12, 24]
  exposure_checkpoints:
    Cus50: [128000000, 256000000, 512000000]
    Cus100: [64000000, 128000000, 256000000]
    Cus500: [80000000, 160000000, 320000000]
    Cus1000: [5000000, 10000000, 20000000]
  customer_exposure_budget_by_scale:
    Cus50: 512000000
    Cus100: 256000000
    Cus500: 320000000
    Cus1000: 20000000
  logical_batch_by_scale:
    Cus50: 1024
    Cus100: 256
    Cus500: 64
    Cus1000: 2
  physical_microbatch_by_method_scale:
    am_evrptw: {Cus50: 1024, Cus100: 256, Cus500: 8, Cus1000: 2}
    evrptw_rl: {Cus50: 224, Cus100: 68, Cus500: 16, Cus1000: 2}
    drl_ts: {Cus50: 132, Cus100: 34, Cus500: 8, Cus1000: 2}
    terran: {Cus50: 256, Cus100: 128, Cus500: 64, Cus1000: 2}

model_selection:
  validation_views: 500
  validation_decode_type: sampling
  validation_candidate_count: 100
  candidate_selection: independent_verifier_feasible_then_min_directed_distance
  minimum_training_epochs: 5000
  maximum_training_epochs: 10000
  validation_every_epochs_through_minimum: 250
  validation_every_epochs_after_minimum: 50
  primary_metric: independent_verifier_feasibility_rate
  secondary_metric: mean_verified_directed_distance
  early_stopping: enabled_after_minimum_budget
  early_stop_patience_validation_checks: 10
  early_stop_no_improvement_epochs_equivalent: 500
  early_stop_start_epoch_exclusive: 5000
  earliest_possible_early_stop_epoch: 5500
  primary_checkpoint: best_overall.ckpt
  minimum_budget_checkpoint: best_within_5000.ckpt
  extended_checkpoint: best_overall.ckpt
  validation_seed_rule: fixed_training_seed_plus_910000000
  test_used_for_selection: false

test_inference:
  decode_type: sampling
  candidate_count: 100
  candidate_selection: independent_verifier_feasible_then_min_directed_distance
  note: common benchmark budget; paper-supported but not paper-exact candidate counts

training_stage_boundaries:
  am_ema_warmup_end_update: 2500
  evrptw_rl_ema_warmup_end_update: 1000
  drl_ts_soft_stage_end_update: 2500
  boundaries_independent_of_maximum_epochs: true

training_trajectories_per_instance:
  am_evrptw: 5
  evrptw_rl: 1
  drl_ts: 1
  terran: 100
training_trajectories_per_instance_by_method_scale: {}

euclidean:
  distance: symmetric_straight_line_from_fixed_coordinates
  energy: same_rho_times_euclidean_distance
  speed_groups: [weekday, weekend]
  speed_calibration: aggregate_ratio_on_preregistered_training_only_od_pairs
  shared_across_training_cities: true
  validation_or_test_calibration: forbidden
  manifest_required: true

formal_launch_gates:
  G1:
    requirement: customer_exposure_budget_for_every_scale
    status: PILOT_WAIVED_BY_USER
  G2:
    requirement: shared_deterministic_stratified_shuffle_cycle_id_stream
    status: IMPLEMENTED_RELEASE_EXECUTION_REQUIRED
  G3:
    requirement: exposure_and_gpu_hour_checkpoints
    status: PILOT_WAIVED_BY_USER
  G4:
    requirement: common_logical_batch_for_every_scale
    status: PILOT_WAIVED_BY_USER
  G5:
    requirement: per_method_physical_microbatch_and_oom_policy
    status: PILOT_WAIVED_BY_USER
  G6:
    requirement: cross_hardware_same_config_runtime_and_memory_pilot
    status: PILOT_WAIVED_BY_USER
  G7:
    requirement: euclidean_distance_time_energy_generation_manifest
    status: PARTIAL_IMPLEMENTATION_FEASIBILITY_AUDIT_REQUIRED
  G8:
    requirement: parent_family_clustered_paired_bootstrap_aggregation
    status: IMPLEMENTED_UNIT_TESTED
