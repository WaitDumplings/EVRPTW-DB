schema: drl_rq_runtime_candidates_v2
status: reward_contract_v3_formal_terran_authorized
protocol_id: drl_rq_protocol_frozen_v1
runtime_budget_id: drl_rq_runtime_budget_v15_ntraj50_maxbatch_warmstart
formal_launch_allowed: true
launch_policy: reward_contract_v3_formal_user_authorized
authorized_job_ids:
  - full__G__Full-support__terran__Cus500__seed1234
  - full__G__Full-support__terran__Cus1000__seed1234
authorized_terran_training_profile_by_scale:
  Cus500: {physical_batch_size: 74, effective_batch_size: 74, training_trajectory_count: 50}
  Cus1000: {physical_batch_size: 4, effective_batch_size: 4, training_trajectory_count: 50}
formal_launch_gates:
  G1: PILOT_WAIVED_BY_USER
  G2: IMPLEMENTED_UNIT_TESTED
  G3: PILOT_WAIVED_BY_USER
  G4: PILOT_WAIVED_BY_USER
  G5: PILOT_WAIVED_BY_USER
  G6: PILOT_WAIVED_BY_USER
  G7: IMPLEMENTED_UNIT_TESTED
  G8: IMPLEMENTED_UNIT_TESTED
objective_config_path: EVRPTW_Benchmark/Reinforcement_Learning/configs/rivian_energy_vehicle_cost_v2.json
reward_contract_config_path: EVRPTW_Benchmark/Reinforcement_Learning/configs/drl_reward_contract_energy_vehicle_v3.json
reward_contract_revision: drl_energy_vehicle_reference_scale_v3
training_stream_registry_path: EVRPTW_Benchmark/Reinforcement_Learning/configs/drl_training_stream_registry_v1.json
training_stream_registry_sha256: 3cc81d4beb90c849f78bf8820d77edb1b1bb4a3a3192f6237f2a717b44b1a041
# This contract has independent training-only reference calibrations for all
# four training scales. The queue builder rejects any enabled scale outside it.
reward_contract_calibrated_scales: [Cus50, Cus100, Cus500, Cus1000]
reward_contract_blocked_scales: []

# Method-specific auxiliary objectives are versioned independently of the
# shared C/S + terminal-failure reward contract. DRL-TS uses its profile only
# during Stage-1 soft curriculum; EVRPTW-RL keeps its explicit station term on
# a fixed per-customer scale. DRL-TS Stage 2 remains the shared hard task.
method_auxiliary_profiles:
  drl_ts: EVRPTW_Benchmark/Reinforcement_Learning/configs/drl_ts_soft_auxiliary_v1.json
  evrptw_rl: EVRPTW_Benchmark/Reinforcement_Learning/configs/evrptw_rl_station_auxiliary_v1.json

# Use one explicit optimizer contract across every formal DRL method. Learning
# rates remain method-native; decoupled weight decay is shared and versioned.
training_optimizer:
  name: adamw
  weight_decay: 0.01

# Common publication inference budget. Each candidate is independently checked
# by the canonical verifier; selection is feasible-first, then minimum total cost.
evaluation:
  validation_decode_type: sampling
  validation_candidate_count: 100
  test_decode_type: sampling
  test_candidate_count: 100
  selection: verifier_feasible_then_min_total_cost_usd

training_trajectory_count_by_method:
  am_evrptw: 5
  evrptw_rl: 1
  drl_ts: 1
  terran: 50
# Keep each method's training-trajectory semantics hardware invariant. AM uses
# five sampled trajectories per base instance on every scale; EVRPTW-RL and
# DRL-TS retain one, while TERRAN uses 50.
training_trajectory_count_by_method_scale: {}

warm_start:
  source_commit: ""
  checkpoint_name: best.ckpt
  scope: exact_job_only
  missing_exact_job: fresh

# The final A6000 TERRAN profile uses batch=74 x n_traj=50 at Cus500 after
# measured batch=128 and batch=112 profiles exceeded the 40--42 GiB target.
# The two measured points predict about 41.9 GiB at batch=74. Cus1000 uses the sustained
# batch=4 x n_traj=50 profile with a 1,250-step train horizon, its derived
# 1,875-step validation horizon, a 624-step PPO chunk, and an explicit
# completion reward. These overrides do not change the other DRL methods.
training_overrides_by_method_scale:
  terran:
    Cus50:
      terran_terminal_success_bonus: 0.0
    Cus100:
      terran_terminal_success_bonus: 0.0
    Cus500:
      num_minibatches: 1
      ppo_step_chunk_size: 36
      terran_terminal_success_bonus: 0.0
    Cus1000:
      training_rollout_steps: 1250
      validation_rollout_steps: 1875
      num_minibatches: 1
      ppo_step_chunk_size: 624
      terran_terminal_success_bonus: 1.0

seeds: [1234]
enabled_scales: [Cus50, Cus100, Cus500, Cus1000]
rollout_steps: {Cus50: 65, Cus100: 120, Cus500: 580, Cus1000: 1200}
# Validation is allowed 50% more decisions than training. Use exact integer
# arithmetic and round upward, so odd training horizons are never shortened:
# ceil(training_rollout_steps * 3 / 2).
validation_rollout_step_limit:
  relative_to: training_rollout_steps
  numerator: 3
  denominator: 2
  rounding: ceiling

# Cus50/Cus100 run on the measured 11 GiB profiles; large graph scales remain
# assigned to the two RTX 6000 Ada GPUs.
scale_hardware:
  2080ti: [Cus50, Cus100]
  a6000: [Cus500, Cus1000]

# One logical epoch is one benchmark outer training iteration over the listed
# number of base environments. TERRAN performs its native PPO inner optimizer
# steps inside that iteration. Every scale has a 5,000-epoch minimum and a
# 10,000-epoch hard cap. Per-method batches are intentionally not exposure
# matched: this profile maximizes safe device utilization for each architecture.
# Every method still uses deterministic training-only streams and the same
# validation/test decoding budget.
candidate_minimum_logical_epochs:
  Cus50: 5000
  Cus100: 5000
  Cus500: 5000
  Cus1000: 5000
candidate_logical_epochs:
  Cus50: 10000
  Cus100: 10000
  Cus500: 10000
  Cus1000: 10000
# Per-method effective batches intentionally prioritize GPU utilization over
# matched exposure. RTX 2080 Ti values passed 2 training epochs plus the full
# 500-view x 50-candidate validation on every assigned representation/support
# condition. A6000 values remain conservative pending calibration on that host.
candidate_logical_batch_by_method_scale:
  am_evrptw: {Cus50: 2304, Cus100: 800, Cus500: 64, Cus1000: 2}
  evrptw_rl: {Cus50: 336, Cus100: 96, Cus500: 64, Cus1000: 2}
  drl_ts: {Cus50: 144, Cus100: 40, Cus500: 64, Cus1000: 2}
  terran: {Cus50: 480, Cus100: 280, Cus500: 74, Cus1000: 4}
candidate_customer_exposure_budget_by_method_scale:
  am_evrptw: {Cus50: 1152000000, Cus100: 800000000, Cus500: 320000000, Cus1000: 20000000}
  evrptw_rl: {Cus50: 168000000, Cus100: 96000000, Cus500: 320000000, Cus1000: 20000000}
  drl_ts: {Cus50: 72000000, Cus100: 40000000, Cus500: 320000000, Cus1000: 20000000}
  terran: {Cus50: 240000000, Cus100: 280000000, Cus500: 370000000, Cus1000: 40000000}
# Ada caps are restricted to exact divisors of the frozen logical batch. The
# user-authorized workflow launches the formal queues directly without pilots.
physical_batch_caps:
  am_evrptw: {Cus50: 2304, Cus100: 800, Cus500: 8, Cus1000: 2}
  evrptw_rl: {Cus50: 336, Cus100: 96, Cus500: 16, Cus1000: 2}
  drl_ts: {Cus50: 144, Cus100: 40, Cus500: 8, Cus1000: 2}
  terran: {Cus50: 480, Cus100: 280, Cus500: 74, Cus1000: 4}

formal_candidate:
  selection_validation_views:
    Cus50: 500
    Cus100: 500
    Cus500: 500
    Cus1000: 500
  final_validation_views: {}
  validation_every_epochs: 100
  post_minimum_validation_every_epochs: 100
  early_stop_patience_validations: 5
  early_stopping: enabled_after_minimum_budget
  early_stop_start_epoch: 5000
  earliest_possible_early_stop_epoch: 5500
  early_stop_patience_epochs_equivalent: 500
  drl_ts_soft_stage_end_epoch: 2500
  validation_seed_offset: 910000000
  checkpoint_selection: feasibility_rate_then_mean_verified_cost_usd
  exposure_checkpoints_fraction: [0.25, 0.50, 1.00]
  gpu_hour_checkpoints: [6, 12, 24]

artifacts_relative_root: EVRPTW_Benchmark/results/DRL_rq_v1/artifacts
output_relative_root: EVRPTW_Benchmark/results/DRL_rq_v1
file_hash_validation_performed: false
