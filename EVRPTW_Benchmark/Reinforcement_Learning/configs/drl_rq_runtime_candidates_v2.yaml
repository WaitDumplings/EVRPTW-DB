  - full__E__Full-support__am_evrptw__Cus100__seed1234
  - full__E__Full-support__evrptw_rl__Cus100__seed1234
  - full__E__Full-support__drl_ts__Cus100__seed1234
  - full__G__Full-support__am_evrptw__Cus100__seed1234
  - full__G__Full-support__evrptw_rl__Cus100__seed1234
  - full__G__Full-support__drl_ts__Cus100__seed1234
  - full__G__Full-support__terran__Cus100__seed1234
  - full__E__Full-support__terran__Cus100__seed1234
  - full__G__Random-10%-support__am_evrptw__Cus100__seed1234
  - full__G__Random-10%-support__terran__Cus100__seed1234
