schema: drl_rq_runtime_candidates_v2
status: formal_runtime_active
protocol_id: drl_rq_protocol_frozen_v1
runtime_budget_id: drl_rq_runtime_budget_v12_min5000_max10000_tailval50
formal_launch_allowed: true
launch_policy: direct_full_user_authorized_2026-09-04

# Common publication inference budget. Each candidate is independently checked
# by the canonical verifier; selection is feasible-first, then minimum distance.
evaluation:
  validation_decode_type: sampling
  validation_candidate_count: 100
  test_decode_type: sampling
  test_candidate_count: 100
  selection: verifier_feasible_then_min_directed_distance

training_trajectory_count_by_method:
  am_evrptw: 1
  evrptw_rl: 1
  drl_ts: 1
  terran: 100
# On the Ada-only large scales AM completed sample-100 training. EVRPTW-RL
# and DRL-TS remain at one trajectory because both OOM at batch 1 with 100.
training_trajectory_count_by_method_scale:
  am_evrptw: {Cus500: 100, Cus1000: 100}

# TERRAN Cus1000 produces two base-environment groups per logical epoch at the
# registered batch of 2. Process them as one PPO minibatch and evaluate up to
# 736 recorded steps in one chunk. Keeping this override here (rather
# than in TERRAN's shared base config) leaves every other scale unchanged.
training_overrides_by_method_scale:
  terran:
    Cus1000:
      num_minibatches: 1
      ppo_step_chunk_size: 736

seeds: [1234]
enabled_scales: [Cus50, Cus100, Cus500, Cus1000]
rollout_steps: {Cus50: 65, Cus100: 120, Cus500: 580, Cus1000: 1200}

# Keep the 11 GiB servers on the two measured-safe scales. Larger graph scales
# are queued only on the two 48 GiB Ada GPUs.
scale_hardware:
  2080ti: [Cus50, Cus100]
  a6000: [Cus500, Cus1000]

# One logical epoch is one benchmark outer training iteration over the listed
# number of base environments. TERRAN performs its native PPO inner optimizer
# steps inside that iteration. Every scale has a 5,000-epoch minimum and a
# 10,000-epoch hard cap. Fairness is enforced
# within each scale: every method and seed sees the same deterministic stream
# and effective batch. Cross-scale customer exposure is intentionally not forced
# to match because the scales are not compared as one optimization task.
candidate_minimum_logical_epochs:
  Cus50: 5000
  Cus100: 5000
  Cus500: 5000
  Cus1000: 5000
candidate_logical_epochs:
  Cus50: 10000
  Cus100: 10000
  Cus500: 10000
  Cus1000: 10000
candidate_environments_per_epoch:
  Cus50: 1024
  Cus100: 256
  Cus500: 64
  Cus1000: 2
candidate_customer_exposure_budget:
  Cus50: 512000000
  Cus100: 256000000
  Cus500: 320000000
  Cus1000: 20000000

# The effective/logical batch equals environments_per_epoch. For the three
# REINFORCE trainers, exact sample-weighted gradient accumulation produces one
# optimizer update per logical epoch, including a possible final remainder
# microbatch. TERRAN retains its explicitly documented PPO inner-update
# schedule and exact physical divisors.
candidate_logical_batch:
  Cus50: 1024
  Cus100: 256
  Cus500: 64
  Cus1000: 2
# Ada caps are restricted to exact divisors of the frozen logical batch. The
# user-authorized workflow launches the formal queues directly without pilots.
physical_batch_caps:
  am_evrptw: {Cus50: 1024, Cus100: 256, Cus500: 8, Cus1000: 2}
  evrptw_rl: {Cus50: 224, Cus100: 68, Cus500: 16, Cus1000: 2}
  drl_ts: {Cus50: 132, Cus100: 34, Cus500: 8, Cus1000: 2}
  terran: {Cus50: 256, Cus100: 128, Cus500: 64, Cus1000: 2}

formal_candidate:
  selection_validation_views:
    Cus50: 500
    Cus100: 500
    Cus500: 500
    Cus1000: 500
  final_validation_views: {}
  validation_every_epochs: 250
  post_minimum_validation_every_epochs: 50
  early_stop_patience_validations: 10
  early_stopping: enabled_after_minimum_budget
  early_stop_start_epoch: 5000
  earliest_possible_early_stop_epoch: 5500
  early_stop_patience_epochs_equivalent: 500
  drl_ts_soft_stage_end_epoch: 2500
  validation_seed_offset: 910000000
  checkpoint_selection: feasibility_rate_then_mean_verified_distance
  exposure_checkpoints_fraction: [0.25, 0.50, 1.00]
  gpu_hour_checkpoints: [6, 12, 24]

artifacts_relative_root: EVRPTW_Benchmark/results/DRL_rq_v1/artifacts
output_relative_root: EVRPTW_Benchmark/results/DRL_rq_v1
file_hash_validation_performed: false
