# RTX 2080 Ti canonical benchmark profile; independent stable-cost experiments
# use TERRAN.stable_cli. See README.md for calibration and reward invariants.
run_name: TERRAN-2080ti-Cus100-critic-stability-v1
dataset_name: EVRPTW-DB-Stage2
objective: EVRPTW_Benchmark/Reinforcement_Learning/configs/rivian_energy_vehicle_cost_v2.json
reward_contract: EVRPTW_Benchmark/Reinforcement_Learning/configs/drl_reward_contract_energy_vehicle_v3.json
data:
  stage2_dataset_path: null
  stage2_family_root: null
  stage2_scale: Cus100
  stage2_split_ids: train
  stage2_track_ids: train
  stage2_city_slugs: null
  stage2_cache_size: 16
  num_customers: 100
  num_charging_stations: 20
env:
  use_fast_env: true
  use_jit_mask: true
  normalize_reward: true
  reward_distance_scale_mode: single_customer_repair_median
  invalid_action_penalty: 0.0
  charging_mode: station_power_full
  matrix_mode: canonical
model:
  embedding_dim: 256
  tanh_clipping: 15.0
  n_encode_layers: 3
  use_graph_token: false
  use_dynamic_embedding: false
training:
  epochs: 10000
  num_envs_per_gpu: 280
  n_traj: 50
  rollout_steps: 120
  cache_rollout_encoder: true
  ppo_step_chunk_size: 64
  ppo_update_epochs: 3
  num_minibatches: 4
  gamma: 1.0
  reward_contract_id: drl_energy_vehicle_reference_scale_v3
  clip_coef: 0.2
  value_loss_type: smooth_l1
  value_loss_beta: 1.0
  value_residual_scale: 1.0
  vf_coef: 0.1
  critic_backbone_grad_scale: 0.1
  critic_gradient_diagnostics_every_epochs: 25
  ent_coef: 0.01
  learning_rate: 0.0001
  optimizer: adamw
  weight_decay: 0.01
  max_grad_norm: 1.0
  checkpoint_interval: 25
  gradient_accumulation_steps: 1
  debug: false
  profile_timing: false
pbrs:
  use_customer_pbrs: true
  use_repair_distance_pbrs: true
  use_feasible_ratio_pbrs: false
  use_terminal_heuristic: false
  use_terminal_task_penalty: true
  customer_pbrs_mode: progress
  customer_pbrs_coef: 1.0
  customer_progress_budget: 0.5
  customer_progress_mix: 0.5
  repair_progress_coef: 0.5
  terminal_success_bonus: 0.0
  success_bonus: 0.0
  failure_base: 0.0
  unserved_coefficient: 1.0
  annealing:
    enabled: true
    start_scale: 1.0
    end_scale: 0.2
    start_epoch: 1
    end_epoch: 5000
    schedule: cosine
evaluation:
  eval_interval: 100
